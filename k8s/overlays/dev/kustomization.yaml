apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: hmsmiraz/techedu-auth-service
    newTag: dev
  - name: hmsmiraz/techedu-content-service
    newTag: dev
  - name: hmsmiraz/techedu-gateway
    newTag: dev
  - name: hmsmiraz/techedu-landing
    newTag: dev
  - name: hmsmiraz/techedu-admin
    newTag: dev
  - name: hmsmiraz/techedu-learning-portal
    newTag: dev

secretGenerator:
  - name: mysql-secret
    envs:
      - mysql-secret.env
  - name: app-secret
    envs:
      - app-secret.env

# NOTE: cors-origins and the loadBalancerIP patches below use placeholders
# until static IPs are reserved for this namespace — see k8s/README.md.
configMapGenerator:
  - name: app-config
    literals:
      - cors-origins=http://REPLACE_WITH_RESERVED_IP:3000,http://REPLACE_WITH_RESERVED_IP:3001,http://REPLACE_WITH_RESERVED_IP:3002

patches:
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "REPLACE_WITH_RESERVED_IP"
  - target:
      kind: Service
      name: landing
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "REPLACE_WITH_RESERVED_IP"
  - target:
      kind: Service
      name: admin
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "REPLACE_WITH_RESERVED_IP"
  - target:
      kind: Service
      name: learning-portal
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "REPLACE_WITH_RESERVED_IP"
  # dev: small, cheap, standard storage — genuinely disposable, no backup
  # strategy needed. Losing this data is a non-event.
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "2Gi"
