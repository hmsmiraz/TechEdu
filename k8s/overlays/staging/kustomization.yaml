apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - namespace.yaml
  - ../../base

images:
  - name: hmsmiraz/techedu-auth-service
    newTag: staging
  - name: hmsmiraz/techedu-content-service
    newTag: staging
  - name: hmsmiraz/techedu-gateway
    newTag: staging
  - name: hmsmiraz/techedu-landing
    newTag: staging
  - name: hmsmiraz/techedu-admin
    newTag: staging
  - name: hmsmiraz/techedu-learning-portal
    newTag: staging

secretGenerator:
  - name: mysql-secret
    envs:
      - mysql-secret.env
  - name: app-secret
    envs:
      - app-secret.env

# cors-origins: all three frontends now share one origin (path-routed
# through the gateway), so CORS just needs that single origin.
configMapGenerator:
  - name: app-config
    literals:
      - cors-origins=http://8.231.99.218:8080

patches:
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "8.231.99.218"
  # staging: matches production shape at smaller scale — real persistence,
  # real storage class, so it's a meaningful pre-prod test.
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "5Gi"
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "premium-rwo"
