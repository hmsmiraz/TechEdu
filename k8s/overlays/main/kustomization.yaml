apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: main

resources:
  - namespace.yaml
  - ../../base

images:
  - name: hmsmiraz/techedu-auth-service
    newTag: main
  - name: hmsmiraz/techedu-content-service
    newTag: main
  - name: hmsmiraz/techedu-gateway
    newTag: main
  - name: hmsmiraz/techedu-landing
    newTag: main
  - name: hmsmiraz/techedu-admin
    newTag: main
  - name: hmsmiraz/techedu-learning-portal
    newTag: main

secretGenerator:
  - name: mysql-secret
    envs:
      - mysql-secret.env
  - name: app-secret
    envs:
      - app-secret.env

# cors-origins: all three frontends now share one origin (path-routed
# through the gateway), so CORS just needs that single origin.
configMapGenerator:
  - name: app-config
    literals:
      - cors-origins=http://8.231.68.147:8080

patches:
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/loadBalancerIP
        value: "8.231.68.147"
  # main (production): real sizing, premium SSD-backed storage class for
  # actual I/O performance. NOTE: this does not yet include automated
  # backups (e.g. GCP persistent disk snapshot schedule or Velero) — that's
  # a real gap worth closing before this holds real user data long-term,
  # flagging it now rather than pretending this is production-complete.
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "20Gi"
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "premium-rwo"
