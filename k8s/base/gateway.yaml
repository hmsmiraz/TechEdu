apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hmsmiraz/techedu-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: AUTH_SERVICE_HOST
              value: auth-service
            - name: AUTH_SERVICE_PORT
              value: "8000"
            - name: CONTENT_SERVICE_HOST
              value: content-service
            - name: CONTENT_SERVICE_PORT
              value: "8001"
            - name: ADMIN_SERVICE_HOST
              value: admin
            - name: ADMIN_SERVICE_PORT
              value: "3001"
            - name: LEARNING_PORTAL_SERVICE_HOST
              value: learning-portal
            - name: LEARNING_PORTAL_SERVICE_PORT
              value: "3002"
            - name: LANDING_SERVICE_HOST
              value: landing
            - name: LANDING_SERVICE_PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  # loadBalancerIP set per-namespace via overlay patch — this placeholder
  # gets replaced, never used as-is.
  loadBalancerIP: "REPLACE_WITH_RESERVED_IP"
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 80
